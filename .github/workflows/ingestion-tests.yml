name: Ingestion tests

on:
  pull_request:
    paths: ["ingestion/**", ".github/workflows/ingestion-tests.yml"]
  push:
    branches: [dev, "Main/Production"]
    paths: ["ingestion/**", ".github/workflows/ingestion-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingestion/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
